[package]
name = "stackfish-host"
version = "0.1.0"
edition = "2024"

[dependencies]
stackfish-carddb = { path = "../carddb" }
stackfish-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
stackfish-testutil = { path = "../testutil" }
