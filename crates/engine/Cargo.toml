[package]
name = "stackfish-engine"
version = "0.1.0"
edition = "2024"
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
bitflags = "2"
mlua = { version = "0.9", features = ["lua54", "vendored"] }

[dev-dependencies]
rusqlite = { workspace = true }
stackfish-scenario = { path = "../scenario" }
stackfish-testutil = { path = "../testutil" }
