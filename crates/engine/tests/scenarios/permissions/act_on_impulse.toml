# CR 400.7j: Act on Impulse exiles the top three cards of its controller's library, and the
# controller may play those cards this turn but no others. The real card lasts until the end of
# your next turn; the engine has no such duration yet, so this fixture uses this turn.
seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "impulse"
name = "Act on Impulse"
types = ["Sorcery"]
script = """
local s = {}
function s.operation()
    local land = Game.CreateZonePermission(0)
    land:SetAffected(Game.Affected.You)
    land:SetZone("Exile")
    land:SetKind("PlayLand")
    land:SetExiledByThisEffect()
    local cast = Game.CreateZonePermission(0)
    cast:SetAffected(Game.Affected.You)
    cast:SetZone("Exile")
    cast:SetKind("Cast")
    cast:SetExiledByThisEffect()
    return Game.Ops.Chain(
        Game.Ops.ExileTopLinked(3),
        Game.Ops.GrantZonePermission(land, Game.Durations.UntilEndOfTurn),
        Game.Ops.GrantZonePermission(cast, Game.Durations.UntilEndOfTurn)
    )
end
function s.register_abilities(c)
end
return s
"""

