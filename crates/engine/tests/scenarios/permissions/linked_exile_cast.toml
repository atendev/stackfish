# CR 607.2a: once cast, a source exiles a creature with Game.Ops.ExileLinked, and its linked zone
# permission then lets its controller cast that card from exile. A card already in exile
# that the source never exiled is refused.
seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "keeper"
name = "Linked Keeper"
types = ["Artifact"]
script = """
local s = {}
function s.register_abilities(c)
    local a = Game.CreateActivatedAbility(c)
    a:SetTarget({ card_types = { "Creature" } })
    a:SetOperation(Game.Ops.ExileLinked)
    a:Register()
    local p = Game.CreateZonePermission(c)
    p:SetAffected(Game.Affected.You)
    p:SetZone("Exile")
    p:SetKind("Cast")
    p:SetOwner(Game.Affected.Any)
    p:SetLinked()
    p:Register()
end
return s
"""

