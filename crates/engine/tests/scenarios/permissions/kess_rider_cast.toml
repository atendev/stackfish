# CR 601.3, 608.2n: Kess, Dissident Mage lets its controller cast an instant or sorcery from
# their graveyard, and a spell cast that way is exiled instead of returning there. A sorcery
# cast from hand still goes to the graveyard, a graveyard creature stays uncastable, and the
# graveyard sorcery is refused before Kess resolves.
# Kess's once-per-turn limit is not modeled, so this fixture casts through it once.
seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "kess"
name = "Kess, Dissident Mage"
types = ["Creature"]
power = 3
toughness = 4
script = """
local s = {}
function s.register_abilities(c)
    local p = Game.CreateZonePermission(c)
    p:SetAffected(Game.Affected.You)
    p:SetZone("Graveyard")
    p:SetKind("Cast")
    p:SetFilter(Game.Filter({ card_types = { "Instant", "Sorcery" } }))
    p:SetRider("ExileInsteadOfGraveyard")
    p:Register()
end
return s
"""

[[cards]]
key = "rite"
name = "Graveyard Rite"
types = ["Sorcery"]

[[cards]]
key = "study"
name = "Hand Study"
types = ["Sorcery"]

[[cards]]
