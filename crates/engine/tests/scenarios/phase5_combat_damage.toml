player = 0
[[actions]]
type = "pass_priority"
player = 1
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1

[[actions]]
type = "declare_attackers"
player = 0
attackers = [
  { attacker = "bear", target = 1 },
]

# One more pair of passes to reach the declare blockers step.
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1

[[actions]]
type = "declare_blockers"
player = 1
blocks = [
  { blocker = "wall1", attacker = "bear" },
  { blocker = "wall2", attacker = "bear" },
]

# One more pair of passes to reach the combat damage step.
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1

[[actions]]
type = "assign_combat_damage"
player = 0
assignments = [
  { attacker = "bear", splits = [
    { blocker = "wall1", amount = 3 },
    { blocker = "wall2", amount = 2 },
  ] },
]

[[assertions]]
type = "step"
equals = "combat_damage"

[[assertions]]
type = "object_zone"
card = "wall1"
equals = "graveyard"

[[assertions]]
type = "object_zone"
