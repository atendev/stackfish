# Two players, so every step transition needs both to pass in a row
# (CR 117.4) - 6 step transitions to reach the declare attackers step:
# PreGame -> Untap -> Upkeep -> Draw -> PreCombatMain -> BeginningOfCombat
# -> DeclareAttackers, 2 passes each.
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1
[[actions]]
type = "pass_priority"
player = 0
[[actions]]
type = "pass_priority"
player = 1
[[actions]]
