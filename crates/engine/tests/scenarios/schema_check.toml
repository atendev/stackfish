# Parser smoke test for docs/scenario_format.md's documented action shapes.
# Not meant to pass any real gameplay assertions yet - just proves every
# documented action/target shape actually deserializes. PassPriority is now
# implemented (Phase 5 pass-priority-loop slice), so its action genuinely
# logs an event - ledger_len below reflects that one real event, not the
# all-todo!() baseline of 0 from before.
seed = 3

[[players]]
id = 0
life = 20

[[players]]
id = 1
life = 20

[[cards]]
