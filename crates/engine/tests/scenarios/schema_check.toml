name = "Test Bear"
generic_cost = 1
colors = ["G"]
types = ["Creature"]
power = 2
toughness = 2

[[cards]]
key = "shock"
name = "Test Shock"
generic_cost = 1
colors = ["R"]
types = ["Instant"]

[[setup]]
player = 0
zone = "battlefield"
card = "bear"

[[setup]]
player = 0
zone = "hand"
card = "shock"

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "play_land"
player = 0
card = "bear"

[[steps]]
type = "cast_spell"
player = 0
card = "shock"
