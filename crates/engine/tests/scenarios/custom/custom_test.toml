# Animate Wall: an Aura that removes Defender from its enchanted creature
# (CR 613.1f's "can attack as though it didn't have defender" shape, same
# primitive Assault Formation uses - Game.Effects.RemoveKeyword("Defender")
# on an AbilityAdding-layer static ability, scoped enchanted_only). Proves
# the whole pipeline: the Aura's own s.target_requirement() only allows
# targeting a Wall (CR 702.5a's "Enchant Wall"), CastSpell validates and
# resolution auto-attaches it (CR 303.4b, via CardSpec.subtypes = ["Aura"]),
# and the enchanted Wall can then declare as an attacker despite printed
# Defender (CR 302.6b) - the actual proof the ability worked.
seed = 42

[[players]]
id = 0
life = 20

[[players]]
id = 1
life = 20

[[cards]]
key = "wall"
name = "Test Wall"
types = ["Creature"]
subtypes = ["Wall"]
keywords = ["Defender"]
power = 0
toughness = 4

[[cards]]
key = "animate_wall"
name = "Animate Wall"
types = ["Enchantment"]
subtypes = ["Aura"]
script = """
local s = {}

function s.target_requirement()
    return {
        card_types = {"Creature"},
        subtypes = {"Wall"},
        count = 1,
    }
end

function s.register_abilities(c)
    local e = Game.CreateStaticAbility(c)
    e:SetLayer(Game.Layers.AbilityAdding)
    e:SetEffect(Game.Effects.RemoveKeyword("Defender"))
    e:SetAffected({ enchanted_only = true })
    e:Register()
end

return s
"""

# controlled_since_turn defaults to 0, which is always less than any real
# turn_number - so the Wall is never summoning sick, i.e. already "controlled
# since before this turn" from the moment the scenario starts.
[[setup]]
player = 0
zone = "battlefield"
card = "wall"

[[setup]]
player = 0
zone = "hand"
card = "animate_wall"

# Two players, so every step transition needs both to pass in a row (CR
# 117.4). 2 pairs (4 passes) reach PreCombatMain: PreGame -> Untap (no
# priority window, CR 502.4, auto-chains into Upkeep) -> Upkeep -> Draw
# (SKIPPED for the starting player's first turn, CR 103.8a) -> PreCombatMain.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1

[[steps]]
type = "assert_phase"
equals = "main"
[[steps]]
type = "assert_step"
equals = "pre_combat_main"

# Player 1 (p0) casts Animate Wall targeting the Wall - legal only because
# the Wall carries the Wall subtype (CardSpec.subtypes wiring).
[[steps]]
type = "cast_spell"
player = 0
card = "animate_wall"
targets = ["wall"]

[[steps]]
type = "submit_payment"
player = 0
# animate_wall has no mana_cost - still needs an explicit empty plan (CR 118.5a).

# The caster keeps priority after casting (CR 117.3c) - one more pass each
# resolves the (now sole) stack object: the Aura enters the battlefield and
# auto-attaches to its already-legality-checked target (CR 303.4b), and its
# static ability (RemoveKeyword(Defender), enchanted_only) registers.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1

[[steps]]
type = "assert_object_zone"
card = "animate_wall"
equals = "battlefield"

# 2 more pairs (4 passes) reach the declare attackers step: PreCombatMain ->
# BeginningOfCombat -> DeclareAttackers.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1

[[steps]]
type = "assert_step"
equals = "declare_attackers"

# Player 1 attacks player 2 with the Wall - illegal per CR 302.6b's printed
# Defender unless Animate Wall's RemoveKeyword(Defender) static ability
# actually took effect. This is the real proof the script works.
[[steps]]
type = "declare_attackers"
player = 0
attackers = [
  { attacker = "wall", target = 1 },
]

[[steps]]
type = "assert_tapped"
card = "wall"
equals = true
