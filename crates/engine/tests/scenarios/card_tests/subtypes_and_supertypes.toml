# Proves CardSpec.subtypes/supertypes (added alongside CardSpec.target_requirement's
# own subtypes/supertypes filters) actually reach CardDefinition.subtypes/.supertypes -
# previously every scenario-built card got Vec::new()/SupertypeSet::empty() hardcoded
# regardless of what a TOML file said, so a "target Human creature"-style filter could
# never be satisfied. Legal targeting here is the proof: if either field weren't wired
# through, CastSpell would reject the target as illegal (CR 601.2e), the same rejection
# crates/engine/tests/phase5_targeting_subtype_filter.rs and
# phase5_targeting_supertype_filter.rs exercise exhaustively against hand-built
# CardDefinitions. This fixture only proves the TOML -> CardSpec -> CardDefinition wiring.
seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "wall"
name = "Test Wall"
types = ["Creature"]
subtypes = ["Wall"]
power = 0
toughness = 4

[[cards]]
key = "general"
name = "Test General"
types = ["Creature"]
supertypes = ["Legendary"]
power = 2
toughness = 2

[[cards]]
key = "target_wall_spell"
name = "Target Wall Spell"
types = ["Instant"]
[cards.target_requirement]
filter = "object"
subtypes = ["Wall"]
count = 1

[[cards]]
key = "target_legendary_spell"
name = "Target Legendary Spell"
types = ["Instant"]
[cards.target_requirement]
filter = "object"
supertypes = ["Legendary"]
count = 1

[[setup]]
player = 0
zone = "battlefield"
card = "wall"

[[setup]]
player = 0
zone = "battlefield"
card = "general"

[[setup]]
player = 0
zone = "hand"
card = "target_wall_spell"

[[setup]]
player = 0
zone = "hand"
card = "target_legendary_spell"

[[cards]]
key = "filler"
name = "Filler Land"
types = ["Land"]

# Solo (1-player) fixture - turn 1's Draw step genuinely runs (CR 103.8a's
# skip-first-draw only applies at 2+ players), so it needs a real card to draw.
[[setup]]
player = 0
zone = "library"
card = "filler"

# A solo player's first PassPriority always counts as "everyone passed", so
# each of these advances one turn/phase/step (CR 500-514) - PreGame -> Untap
# (no priority window) -> Upkeep -> Draw -> Main.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 0

# Legal only because "wall" carries the Wall subtype (CardSpec.subtypes wiring).
[[steps]]
type = "cast_spell"
player = 0
card = "target_wall_spell"
targets = ["wall"]

[[steps]]
type = "submit_payment"
player = 0

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "assert_object_zone"
card = "target_wall_spell"
equals = "graveyard"

# Legal only because "general" carries the Legendary supertype (CardSpec.supertypes wiring).
[[steps]]
type = "cast_spell"
player = 0
card = "target_legendary_spell"
targets = ["general"]

[[steps]]
type = "submit_payment"
player = 0

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "assert_object_zone"
card = "target_legendary_spell"
equals = "graveyard"

[[steps]]
type = "assert_object_zone"
card = "wall"
equals = "battlefield"

[[steps]]
type = "assert_object_zone"
card = "general"
equals = "battlefield"
