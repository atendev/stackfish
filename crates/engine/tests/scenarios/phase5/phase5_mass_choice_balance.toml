equals = "graveyard"

[[steps]]
type = "assert_object_zone"
card = "p0_bear_b"
equals = "graveyard"

[[steps]]
type = "assert_object_zone"
card = "p0_extra_a"
equals = "graveyard"

[[steps]]
type = "assert_object_zone"
card = "p0_extra_b"
equals = "hand"

[[steps]]
type = "assert_hand_size"
player = 0
equals = 1

[[steps]]
