[[setup]]
player = 0
zone = "hand"
card = "bear"

# Solo player: one pass_priority always counts as "everyone passed" (CR
# 500-514), so advance_to_phase should walk PreGame -> Untap -> Upkeep ->
# Draw -> Main in one call, same ground `phase5_cast_spell_payment.toml`
# covers with four explicit pass_priority actions.
[[steps]]
type = "advance_to_phase"
phase = "main"

[[steps]]
type = "assert_phase"
equals = "main"

[[steps]]
type = "assert_step"
equals = "pre_combat_main"

# Already at the target - a no-op, not an error.
[[steps]]
type = "advance_to_phase"
phase = "main"

[[steps]]
type = "advance_to_step"
step = "post_combat_main"

[[steps]]
type = "assert_step"
equals = "post_combat_main"
