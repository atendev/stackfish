# Reach a real priority window before casting (CR 601.2a) - same solo-player
# PreGame -> Main prelude phase5_cast_spell_payment.toml walks by hand;
# phase5_scenario_shortcuts_advance.toml covers advance_to_phase itself.
[[steps]]
type = "advance_to_phase"
phase = "main"

# Nothing floating - auto_pay must tap both untapped mana sources itself
# ({1}{R} needs exactly 2 units) and submit the payment, in the same action
# as the cast.
[[steps]]
type = "cast_spell"
player = 0
card = "shock"
auto_pay = true

[[steps]]
type = "assert_tapped"
card = "mountain"
equals = true

[[steps]]
type = "assert_tapped"
card = "wastes"
equals = true

[[steps]]
