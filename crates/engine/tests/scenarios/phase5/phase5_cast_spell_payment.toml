# Cast a real-cost sorcery, pay it for real from a pre-seeded mana pool, and
# confirm it resolves to the battlefield with the pool correctly debited.
# Exercises the cast-spell-payment slice's TOML hooks (PlayerSpec.mana_pool,
# the SubmitPayment action, the ManaPool assertion) end to end.
seed = 1

[[players]]
id = 0
life = 20
mana_pool = { green = 1, colorless = 2 }

[[cards]]
key = "bear"
name = "Grizzly Bears"
generic_cost = 2
colors = ["G"]
types = ["Creature"]
power = 2
toughness = 2

[[setup]]
player = 0
zone = "hand"
card = "bear"

# A solo player's first PassPriority always counts as "everyone passed"
# (consecutive_passes >= turn_order.len() == 1), so each of these advances
# one turn/phase/step (CR 500-514) - PreGame -> Untap (no priority window,
# CR 502.4 - auto-chains into Upkeep) -> Upkeep -> Draw -> Main. CastSpell's
# non-instant branch needs Phase::Main (sorcery speed).
[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "cast_spell"
player = 0
card = "bear"

[[steps]]
type = "submit_payment"
player = 0
# 1 green for the {G} pip, 2 colorless covering the {2} (CR 118.13a's
# payment choice - mana_payment_choice slice).
mana = { units = ["G", "C", "C"] }

# Resolves the stack (CR 608.2m: a permanent type goes to the battlefield) -
# solo player's pass is again "everyone passed", now with a nonempty stack.
[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "assert_mana_pool"
player = 0
color = "green"
equals = 0

[[steps]]
type = "assert_mana_pool"
player = 0
color = "colorless"
equals = 0

[[steps]]
type = "assert_object_zone"
card = "bear"
equals = "battlefield"

[[steps]]
type = "assert_phase"
equals = "main"

[[steps]]
type = "assert_step"
equals = "pre_combat_main"
