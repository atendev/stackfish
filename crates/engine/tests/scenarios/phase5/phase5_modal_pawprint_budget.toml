# Scenario TOML support for CR 700.2i's pawprint-budget modal shape
# (Fickle Fiend/Kolaghan's Command-style "choose modes with combined
# pawprint value N or less") - ModeChoice::PawprintBudget/
# SpellMode::pawprint_weight are already real and exhaustively tested via
# direct CardDefinition/RegisteredAbility construction (see
# phase5_modal_pawprint_budget.rs); this fixture only proves the TOML ->
# CardSpec.mode_pawprint_budget/SpellModeSpec.pawprint_weight -> real
# ModeChoice/SpellMode wiring connects for real, same "prove the pipeline,
# not the logic" convention phase5_modal_spell_toml.toml already establishes.
seed = 1

[[players]]
id = 0
life = 20

# "Choose any number - each mode worth up to 2 pawprints total." Three
# modes, weights 1/1/2, budget 2. No target_requirement on any mode - a
# TOML-built mode's own effect is always None, so this fixture only cares
# whether the cast itself is accepted or rejected, not what resolving it does.
[[cards]]
key = "budget_ok"
name = "Test Pawprint Budget A"
types = ["Instant"]
mode_pawprint_budget = 2

[[cards.modes]]
pawprint_weight = 1

[[cards.modes]]
pawprint_weight = 1

[[cards.modes]]
pawprint_weight = 2

[[cards]]
key = "budget_over"
name = "Test Pawprint Budget B"
types = ["Instant"]
mode_pawprint_budget = 2

[[cards.modes]]
pawprint_weight = 1

[[cards.modes]]
pawprint_weight = 1

[[cards.modes]]
pawprint_weight = 2

[[setup]]
player = 0
zone = "hand"
card = "budget_ok"

[[setup]]
player = 0
zone = "hand"
card = "budget_over"

# Modes 0+1 together weigh exactly 2 - fits the budget exactly.
[[steps]]
type = "cast_spell"
player = 0
card = "budget_ok"
modes = [0, 1]

[[steps]]
type = "submit_payment"
player = 0

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
type = "assert_object_zone"
card = "budget_ok"
equals = "graveyard"

# Modes 0+1+2 together weigh 4 - over the same budget of 2. If the TOML
# weights had silently defaulted to 0 (the pre-slice behavior), this would
# incorrectly succeed instead of being rejected here.
[[steps]]
type = "cast_spell"
player = 0
card = "budget_over"
modes = [0, 1, 2]
expect_error = true
