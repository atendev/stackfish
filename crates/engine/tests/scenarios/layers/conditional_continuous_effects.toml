player = 0
zone = "battlefield"
card = "anthem"

[[setup]]
player = 0
zone = "battlefield"
card = "trinket"

[[setup]]
player = 0
zone = "battlefield"
card = "bear"
# Lethal against the printed 2 toughness. The anthem's condition (2+
# artifacts) isn't met with only 1 artifact on the battlefield, so - unlike
# the unconditional anthem fixture - no boost saves it.
damage_marked = 2

[[steps]]
type = "pass_priority"
player = 0

[[steps]]
