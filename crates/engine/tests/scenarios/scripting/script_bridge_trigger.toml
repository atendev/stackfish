seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "bear"
name = "Test Bear"
types = ["Creature"]
power = 2
toughness = 2
trigger_condition = """
return function(source, controller, event)
    return event ~= nil and event.kind == "zone_change"
       and event.object == source and event.to == "battlefield"
end
"""
trigger_operation = """
return function(source, controller)
    return Game.Ops.GainLife(1)
end
"""

[[cards]]
key = "filler"
name = "Filler Land"
types = ["Land"]

[[setup]]
player = 0
zone = "hand"
card = "bear"

# This is a solo (1-player) fixture - CR 103.8a's "starting player skips their
# first draw step" only applies in a two-player game (engine.rs's
# advance_turn_step checks turn_order.len() == 2), so p0's turn 1 Draw step
# genuinely runs here and needs a real card to draw (CR 704.5b: an empty
# library on a real draw attempt is a state-based loss, not a silent no-op).
[[setup]]
player = 0
zone = "library"
card = "filler"

[[actions]]
type = "pass_priority"
player = 0
# (x3 total - PreGame -> Untap (auto-chains, no priority window) -> Upkeep -> Draw -> Main)

[[actions]]
type = "pass_priority"
player = 0

[[actions]]
type = "pass_priority"
player = 0

[[actions]]
type = "cast_spell"
player = 0
card = "bear"

[[actions]]
type = "submit_payment"
player = 0
# {0} cost still needs an explicit empty plan (CR 118.5a) - bear has no mana_cost.

[[actions]]
type = "pass_priority"
player = 0
# solo game: a single pass already satisfies "everyone passed" (CR 117.4) -
# resolves the spell. The creature entering the battlefield is exactly the
# ZoneChange the ETB condition matches, so its ability goes on the stack in
# this same pipeline run.

[[actions]]
type = "pass_priority"
player = 0
# resolves the triggered ability itself, invoking its real Lua operation.

