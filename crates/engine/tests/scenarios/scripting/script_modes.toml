# CR 700.2, 601.2b: a card's own `s.modes()` fills in CardDefinition.modes through the
# scenario crate's register_script_modes, and the chosen function mode runs through the
# engine's own runtime.
seed = 1

[[players]]
id = 0
life = 20

[[cards]]
key = "choose_one"
name = "Test Choose One"
types = ["Sorcery"]
script = """
local s = {}
function s.modes()
    return {
        choice = Game.ModeChoice.Exactly(1),
        modes = {
            { operation = Game.Ops.GainLife(3) },
            { operation = function(c, controller) return Game.Ops.GainLife(5) end },
        },
    }
end
return s
"""

[[cards]]
