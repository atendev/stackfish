card = "island1"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "island2"
equals = "hand"

[[cards]]
key = "mountain1"
name = "Mountain"
types = ["Land"]
mana_ability = ["R"]
[[cards]]
key = "mountain2"
name = "Mountain"
types = ["Land"]
mana_ability = ["R"]
[[cards]]
key = "mountain3"
name = "Mountain"
