# Assert player0 starting hand since we aren't shuffling libraries
[[steps]]
type = "assert_object_zone"
card = "forest1"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "forest2"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "forest3"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "dork"
equals = "hand"
[[steps]]
