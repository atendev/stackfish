colors = ["R"]
[[cards]]
key = "goblin2"
name = "Goblin"
types = ["Creature"]
colors = ["R"]
[[cards]]
key = "goblin3"
name = "Goblin"
types = ["Creature"]
colors = ["R"]

[[game.players]]
id = 1
library = ["mountain1", "mountain2", "mountain3","goblin1", "goblin2", "goblin3", "mountain4", "mountain5", "mountain6", "mountain7"]

# Assert Player1 starting hand since we aren't shuffling libraries
[[steps]]
type = "assert_object_zone"
card = "mountain1"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "mountain2"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "mountain3"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "goblin1"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "goblin2"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "goblin3"
equals = "hand"
[[steps]]
type = "assert_object_zone"
card = "mountain4"
equals = "hand"

# Untap doesn't use priority, so we go straight to Upkeep in Beginning
[[steps]]
type = "assert_phase"
equals = "beginning"
[[steps]]
type = "assert_step"
equals = "upkeep"

# On the first turn of a two-player game, the starting player skips their draw step.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1

[[steps]]
type = "assert_phase"
equals = "main"
[[steps]]
type = "assert_step"
equals = "pre_combat_main"

# Playing a land doesn't use priority.
[[steps]]
type = "play_land"
player = 0
card = "forest1"

[[steps]]
type = "assert_object_zone"
card = "forest1"
equals = "battlefield"

[[steps]]
type = "activate_ability"
player = 0
source = "forest1"
ability_index = 0

[[steps]]
type = "assert_mana_pool"
player = 0
color = "green"
equals = 1

[[steps]]
type = "cast_spell"
player = 0
card = "dork"

[[steps]]
type = "assert_object_zone"
card = "dork"
equals = "stack"

[[steps]]
type = "submit_payment"
player = 0
mana = { units = ["G"]}

# Priority window opens after casting a spell, so we need to pass priority to resolve it.
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1

[[steps]]
type = "assert_object_zone"
card = "dork"
equals = "battlefield"

# Go through to combat
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "combat"
[[steps]]
type = "assert_step"
equals = "beginning_of_combat"

# Then to declare attackers
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "combat"
[[steps]]
type = "assert_step"
equals = "declare_attackers"


# Passing through declare attackers wth none declared
# skips to end of combat
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "combat"
[[steps]]
type = "assert_step"
equals = "end_of_combat"

# Pass through end of combat
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "main"
[[steps]]
type = "assert_step"
equals = "post_combat_main"

# Pass through to end phase
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "ending"
[[steps]]
type = "assert_step"
equals = "end"

# cleanup has no priority, so we go to the next turn
# untap for the next turn doesn't have priority
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "assert_phase"
equals = "beginning"
[[steps]]
type = "assert_step"
equals = "upkeep"

#on new player's turn
# we switch order of passing since the active player is now player 1
[[steps]]
type = "pass_priority"
player = 1
[[steps]]
type = "pass_priority"
player = 0
[[steps]]
type = "assert_phase"
equals = "beginning"
[[steps]]
type = "assert_step"
equals = "draw"
